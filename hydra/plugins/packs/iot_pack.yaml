# IoT / Embedded tool pack (Phase M reference plugin). Declarative only.
plugin_id: iot_pack
plugin_name: IoT & Embedded Pack
version: 1.0.0
author: hydra
description: Firmware extraction/analysis, embedded secrets, and hardware-interface auditing.
capabilities:
  - {id: iot_firmware_extract,      category: infrastructure, target_types: [artifact], finding_types: [firmware_finding], verification_coverage: 0, offline_runnable: true, confidence_weight: 0.5,  tools: [binwalk, firmware_mod_kit, ubi_reader, unblob]}
  - {id: iot_firmware_analysis,     category: infrastructure, target_types: [artifact], finding_types: [firmware_finding], verification_coverage: 0, offline_runnable: true, confidence_weight: 0.5,  tools: [firmwalker, emba, binwalk, fact_extractor]}
  - {id: iot_embedded_secrets,      category: secrets,        target_types: [artifact], finding_types: [secret],           verification_coverage: 1, offline_runnable: true, confidence_weight: 0.5,  tools: [trufflehog, firmwalker, strings_scan, gitleaks]}
  - {id: iot_hardware_interface,    category: infrastructure, target_types: [artifact], finding_types: [hardware_finding], verification_coverage: 0, offline_runnable: true, confidence_weight: 0.4,  tools: [jtagulator, openocd, flashrom, urjtag]}
  - {id: iot_serial_audit,          category: infrastructure, target_types: [artifact], finding_types: [hardware_finding], verification_coverage: 0, offline_runnable: true, confidence_weight: 0.35, tools: [picocom, minicom, screen, baudrate]}
  - {id: iot_protocol_analysis,     category: infrastructure, target_types: [artifact], finding_types: [firmware_finding], verification_coverage: 0, offline_runnable: true, confidence_weight: 0.4,  tools: [wireshark, scapy, tshark, mqtt_audit]}
  - {id: iot_bootloader_audit,      category: infrastructure, target_types: [artifact], finding_types: [firmware_finding], verification_coverage: 0, offline_runnable: true, confidence_weight: 0.4,  tools: [uboot_audit, emba, binwalk, ghidra]}
  - {id: iot_rtos_analysis,         category: infrastructure, target_types: [artifact], finding_types: [firmware_finding], verification_coverage: 0, offline_runnable: true, confidence_weight: 0.4,  tools: [emba, ghidra, radare2, binwalk]}
  - {id: iot_wireless_audit,        category: infrastructure, target_types: [artifact], finding_types: [hardware_finding], verification_coverage: 0, offline_runnable: true, confidence_weight: 0.35, tools: [hackrf, gnuradio, rtl_sdr, ubertooth]}
  - {id: iot_binary_analysis,       category: infrastructure, target_types: [artifact], finding_types: [firmware_finding], verification_coverage: 0, offline_runnable: true, confidence_weight: 0.45, tools: [ghidra, radare2, binwalk, cwe_checker]}
  - {id: iot_update_mechanism,      category: infrastructure, target_types: [artifact], finding_types: [firmware_finding], verification_coverage: 1, offline_runnable: true, confidence_weight: 0.4,  tools: [emba, firmware_diff, binwalk, ota_audit]}
dependencies:
  - {from: iot_firmware_analysis,  relation: requires, to: iot_firmware_extract}
  - {from: iot_embedded_secrets,   relation: requires, to: iot_firmware_extract}
  - {from: iot_binary_analysis,    relation: enhances, to: iot_firmware_analysis}
  - {from: iot_bootloader_audit,   relation: related_to, to: iot_firmware_analysis}
