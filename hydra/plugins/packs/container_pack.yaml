# Container & Orchestration tool pack (Phase M reference plugin). Declarative only.
plugin_id: container_pack
plugin_name: Container & Orchestration Pack
version: 1.0.0
author: hydra
description: Docker, Kubernetes, Helm and container-registry audit capabilities.
capabilities:
  - {id: container_docker_audit,    category: infrastructure, target_types: [artifact], finding_types: [container_misconfig], verification_coverage: 1, offline_runnable: true, confidence_weight: 0.5,  tools: [trivy, dockle, hadolint, grype]}
  - {id: container_image_scan,      category: infrastructure, target_types: [artifact], finding_types: [dependency_vuln],     verification_coverage: 1, offline_runnable: true, confidence_weight: 0.55, tools: [trivy, grype, clair, syft]}
  - {id: container_k8s_audit,       category: infrastructure, target_types: [host],     finding_types: [container_misconfig], verification_coverage: 1, offline_runnable: true, confidence_weight: 0.5,  tools: [kube_hunter, kube_bench, kubeaudit, kics]}
  - {id: container_k8s_rbac,        category: infrastructure, target_types: [host],     finding_types: [iam_misconfig],       verification_coverage: 1, offline_runnable: true, confidence_weight: 0.5,  tools: [kubiscan, rbac_tool, kubeaudit, krane]}
  - {id: container_helm_audit,      category: infrastructure, target_types: [artifact], finding_types: [container_misconfig], verification_coverage: 1, offline_runnable: true, confidence_weight: 0.45, tools: [checkov, helm_scan, kubeaudit, kics]}
  - {id: container_registry_enum,   category: infrastructure, target_types: [host],     finding_types: [container_misconfig], verification_coverage: 0, offline_runnable: true, confidence_weight: 0.45, tools: [trivy, skopeo, registry_scan, crane]}
  - {id: container_runtime_audit,   category: infrastructure, target_types: [host],     finding_types: [container_misconfig], verification_coverage: 0, offline_runnable: true, confidence_weight: 0.4,  tools: [falco, tracee, sysdig, kube_hunter]}
  - {id: container_secret_scan,     category: secrets,        target_types: [artifact], finding_types: [secret],              verification_coverage: 1, offline_runnable: true, confidence_weight: 0.5,  tools: [trufflehog, gitleaks, detect_secrets, trivy]}
  - {id: container_network_policy,  category: infrastructure, target_types: [host],     finding_types: [container_misconfig], verification_coverage: 0, offline_runnable: true, confidence_weight: 0.4,  tools: [kube_hunter, netpol_analyzer, kubeaudit, kics]}
  - {id: container_supply_chain,    category: infrastructure, target_types: [artifact], finding_types: [dependency_vuln],     verification_coverage: 1, offline_runnable: true, confidence_weight: 0.5,  tools: [cosign, syft, grype, slsa_verifier]}
  - {id: container_compose_audit,   category: infrastructure, target_types: [artifact], finding_types: [container_misconfig], verification_coverage: 1, offline_runnable: true, confidence_weight: 0.45, tools: [checkov, kics, hadolint, trivy]}
dependencies:
  - {from: container_image_scan,    relation: requires, to: container_docker_audit}
  - {from: container_k8s_rbac,      relation: requires, to: container_k8s_audit}
  - {from: container_supply_chain,  relation: enhances, to: container_image_scan}
  - {from: container_helm_audit,    relation: related_to, to: container_k8s_audit}
